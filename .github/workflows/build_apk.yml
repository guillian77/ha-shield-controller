name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK packages
      run: |
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

    - name: Prepare signing key (optional)
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        set -uo pipefail
        if [ -z "${KEYSTORE_BASE64}" ]; then
          echo "::warning::Aucun keystore (secrets ANDROID_KEYSTORE_*) : APK signé avec la clé debug éphémère du runner, les mises à jour ne pourront pas s'installer par-dessus l'ancienne version."
          exit 0
        fi

        # Tolérant aux retours à la ligne/espaces ajoutés par un copier-coller.
        echo "ANDROID_KEYSTORE_BASE64 : ${#KEYSTORE_BASE64} caractères (3536 attendus pour un .jks PKCS12 de 2,6 ko)"
        if ! printf '%s' "${KEYSTORE_BASE64}" | tr -d ' \t\r\n' | base64 -d > "${RUNNER_TEMP}/release.jks" 2>/dev/null; then
          echo "::error::ANDROID_KEYSTORE_BASE64 n'est pas du base64 valide (valeur tronquée, placeholder, ou fichier non encodé)."
          exit 1
        fi
        if [ ! -s "${RUNNER_TEMP}/release.jks" ]; then
          echo "::error::Le keystore décodé est vide."
          exit 1
        fi

        # Vérifie immédiatement que le mot de passe et l'alias correspondent.
        if ! keytool -list -keystore "${RUNNER_TEMP}/release.jks" \
               -alias "${KEY_ALIAS}" -storepass "${KEY_PASSWORD}" > /dev/null 2>&1; then
          echo "::error::Mot de passe ou alias incorrect pour le keystore fourni (vérifier ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS)."
          exit 1
        fi

        {
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks"
          echo "ANDROID_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
          echo "ANDROID_KEY_ALIAS=${KEY_ALIAS}"
          echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD}"
        } >> "${GITHUB_ENV}"
        echo "Signature stable activée ($(wc -c < "${RUNNER_TEMP}/release.jks") octets, alias ${KEY_ALIAS})."

    - name: Build debug APK with Gradle wrapper
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug --stacktrace \
          -PversionCode=${{ github.run_number }} \
          -PversionName=1.0.${{ github.run_number }}

    - name: Prepare release files (APK + version.json)
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
        SHA=$(sha256sum dist/app-debug.apk | cut -d' ' -f1)
        cat > dist/version.json <<JSON
        {
          "versionCode": ${{ github.run_number }},
          "versionName": "1.0.${{ github.run_number }}",
          "apkUrl": "https://github.com/guillian77/ha-shield-controller/releases/latest/download/app-debug.apk",
          "sha256": "${SHA}",
          "commit": "${{ github.sha }}"
        }
        JSON
        cat dist/version.json

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: dist/app-debug.apk
        if-no-files-found: error

    # URL de téléchargement directe et stable, utilisable dans Downloader :
    # https://github.com/guillian77/ha-shield-controller/releases/latest/download/app-debug.apk
    # version.json sert à la vérification de mise à jour depuis l'application.
    - name: Publish APK and version.json to the "latest" release
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Dernier build (debug)
        body: |
          Build automatique depuis `main` — version 1.0.${{ github.run_number }} (commit ${{ github.sha }}).

          Lien direct : https://github.com/guillian77/ha-shield-controller/releases/latest/download/app-debug.apk
        prerelease: false
        make_latest: true
        files: |
          dist/app-debug.apk
          dist/version.json
        overwrite_files: true
