name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK packages
      run: |
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

    - name: Build debug APK with Gradle wrapper
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    # URL de téléchargement directe et stable, utilisable dans Downloader :
    # https://github.com/guillian77/ha-shield-controller/releases/latest/download/app-debug.apk
    - name: Publish APK to the "latest" release
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Dernier build (debug)
        body: |
          APK debug construit automatiquement depuis `main` (commit ${{ github.sha }}).

          Lien direct : https://github.com/guillian77/ha-shield-controller/releases/latest/download/app-debug.apk
        prerelease: false
        make_latest: true
        files: app/build/outputs/apk/debug/app-debug.apk
        overwrite_files: true
