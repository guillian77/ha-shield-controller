plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// versionCode/versionName sont fournis par la CI (-PversionCode=<run_number>)
def appVersionCode = (project.findProperty("versionCode") ?: "1").toString().toInteger()
def appVersionName = (project.findProperty("versionName") ?: "1.0").toString()

// Clé de signature stable (obligatoire pour que les mises à jour s'installent
// par-dessus l'ancienne version : une clé debug régénérée à chaque build donne
// une signature différente et Android refuse alors la mise à jour).
def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace 'com.dekadmin.hastield'
    compileSdk 34

    if (keystorePath) {
        signingConfigs {
            stable {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.dekadmin.hastield"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            if (keystorePath) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePath) {
                signingConfig signingConfigs.stable
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        // Doit correspondre à la version de Kotlin (1.9.24 -> 1.5.14)
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
